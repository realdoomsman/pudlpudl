<style>
  html, body { margin: 0; padding: 0; background: #000000; }
  .root {
    width: 1000px; height: 1000px; background: #000000;
    display: flex; align-items: center; justify-content: center;
  }
  .root svg { width: 1000px; height: 1000px; display: block; }
</style>
<!-- PUDL mark — a drop landing in a pool: the ripple. References the name
     (PUDL = puddle) and the whole water/pools/rivers world. Wordless, flat
     acid on black, reads as concentric water rings at 48px. -->
<div class="root">
  <svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" stroke="#e8ff1e" stroke-linecap="round">
      <circle cx="500" cy="500" r="315" stroke-width="46" />
      <circle cx="500" cy="500" r="205" stroke-width="52" />
    </g>
    <circle cx="500" cy="500" r="70" fill="#e8ff1e" />
  </svg>
</div>
